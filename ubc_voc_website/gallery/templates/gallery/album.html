<style>
    .photo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 15px;
    }
    .photo-item img {
        width: 100%;
        height: auto;
        border-radius: 4px;
        display: block;
    }
</style>

<h2>Album: {{ album_name|title }}</h2>
<a href="{% url 'gallery_album_index_page' %}">&larr; Back to Albums</a>

<div class="photo-grid">
    {% for photo in photos %}
        <div class="photo-item">
            <img src="{{ photo.image.url }}" alt="{{ photo.title }}" loading="lazy">
            <p>{{ photo.title }}</p>
        </div>
    {% endfor %}
</div>
